<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyxora — Enter the Sound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#08060F;
    --void-2:#120B24;
    --panel: rgba(20,15,38,0.55);
    --panel-border: rgba(176,38,255,0.25);
    --violet:#B026FF;
    --cyan:#29F1D8;
    --pink:#FF5F8A;
    --text:#F4F1FF;
    --muted:#9C93B8;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(ellipse 60% 50% at 20% 15%, rgba(176,38,255,0.16), transparent 60%),
      radial-gradient(ellipse 50% 40% at 85% 80%, rgba(41,241,216,0.10), transparent 60%),
      linear-gradient(180deg, var(--void) 0%, var(--void-2) 100%);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  canvas#stars{position:fixed; inset:0; z-index:0;}

  .stage{
    position:relative;
    z-index:2;
    width:100%;
    max-width:420px;
    padding:24px;
  }

  .brand{
    text-align:center;
    margin-bottom:28px;
  }
  .brand .mark{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:0.02em;
    background: linear-gradient(120deg, var(--cyan), var(--violet) 60%, var(--pink));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 0 18px rgba(176,38,255,0.35));
  }
  .brand .tag{
    margin-top:6px;
    font-size:0.8rem;
    color:var(--muted);
    letter-spacing:0.14em;
    text-transform:uppercase;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:var(--radius);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding:32px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    opacity:0;
    transform: translateY(14px);
    animation: rise 0.7s ease forwards 0.15s;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }

  .oauth-grid{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    margin-bottom:18px;
  }
  .oauth-btn{
    display:flex; align-items:center; justify-content:center;
    height:48px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.09);
    background:rgba(255,255,255,0.03);
    cursor:pointer;
    transition: border-color 0.2s, transform 0.15s, background 0.2s;
    font-size:1.1rem;
  }
  .oauth-btn:hover{
    border-color:var(--violet);
    background:rgba(176,38,255,0.08);
    transform:translateY(-2px);
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    color:var(--muted); font-size:0.75rem; letter-spacing:0.08em;
    margin: 6px 0 18px;
    text-transform:uppercase;
  }
  .divider::before, .divider::after{
    content:''; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
  }

  .tabs{
    display:flex; gap:6px;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
  }
  .tab{
    flex:1; text-align:center;
    padding:9px 0;
    font-size:0.82rem; font-weight:500;
    color:var(--muted);
    border-radius:9px;
    cursor:pointer;
    transition: all 0.2s;
  }
  .tab.active{
    background: linear-gradient(120deg, rgba(176,38,255,0.25), rgba(41,241,216,0.15));
    color:var(--text);
    box-shadow: 0 0 16px rgba(176,38,255,0.2);
  }

  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:0.75rem; color:var(--muted);
    margin-bottom:6px; letter-spacing:0.04em;
  }
  .field input{
    width:100%;
    height:46px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    background:rgba(255,255,255,0.03);
    color:var(--text);
    padding:0 14px;
    font-size:0.92rem;
    font-family:'Inter',sans-serif;
    outline:none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .field input:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(41,241,216,0.12);
  }

  .row-between{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:18px;
    font-size:0.78rem;
    color:var(--muted);
  }
  .remember{ display:flex; align-items:center; gap:7px; cursor:pointer; }
  .remember input{ accent-color:var(--violet); width:14px; height:14px; }
  .row-between a{ color:var(--cyan); text-decoration:none; }

  .cta{
    width:100%; height:50px;
    border:none; border-radius:12px;
    background: linear-gradient(120deg, var(--violet), var(--cyan));
    color:#0A0714;
    font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:0.95rem;
    letter-spacing:0.02em;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition: transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 4px 22px rgba(176,38,255,0.35);
  }
  .cta:hover{ transform:translateY(-1px); box-shadow:0 6px 28px rgba(176,38,255,0.5); }
  .cta:active{ transform:translateY(0px) scale(0.99); }
  .cta.loading .label{ opacity:0; }
  .cta .spinner{
    display:none;
    position:absolute; inset:0; align-items:center; justify-content:center;
  }
  .cta.loading .spinner{ display:flex; }
  .spinner div{
    width:18px; height:18px; border-radius:50%;
    border:2.5px solid rgba(10,7,20,0.25);
    border-top-color:#0A0714;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .footer-note{
    text-align:center; margin-top:20px;
    font-size:0.78rem; color:var(--muted);
  }
  .footer-note a{ color:var(--violet); text-decoration:none; font-weight:500;}

  .session-toast{
    position:fixed; top:20px; left:50%; transform:translate(-50%,-140%);
    background:rgba(20,15,38,0.85);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    padding:10px 18px; border-radius:12px;
    font-size:0.8rem; color:var(--muted);
    display:flex; align-items:center; gap:8px;
    transition: transform 0.5s ease;
    z-index:5;
  }
  .session-toast.show{ transform:translate(-50%, 0); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); }

  ::selection{ background: rgba(176,38,255,0.35); }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="session-toast" id="sessionToast">
  <span class="dot"></span> Checking for an active session…
</div>

<div class="stage">
  <div class="brand">
    <div class="mark">NYXORA</div>
    <div class="tag">Enter the sound</div>
  </div>

  <div class="card">
    <div class="oauth-grid">
      <button class="oauth-btn" title="Continue with Google" onclick="fakeLogin('Google')">G</button>
      <button class="oauth-btn" title="Continue with Apple" onclick="fakeLogin('Apple')"></button>
      <button class="oauth-btn" title="Continue with Facebook" onclick="fakeLogin('Facebook')">f</button>
    </div>

    <div class="divider">or continue with</div>

    <div class="tabs">
      <div class="tab active" data-tab="email" onclick="switchTab('email')">Email</div>
      <div class="tab" data-tab="phone" onclick="switchTab('phone')">Phone + OTP</div>
    </div>

    <form id="emailForm" onsubmit="return handleSubmit(event,'email')">
      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="you@nyxora.com" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <div class="row-between">
        <label class="remember"><input type="checkbox" checked> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="cta" type="submit">
        <span class="label">Sign In</span>
        <span class="spinner"><div></div></span>
      </button>
    </form>

    <form id="phoneForm" style="display:none" onsubmit="return handleSubmit(event,'phone')">
      <div class="field">
        <label>Phone Number</label>
        <input type="tel" placeholder="+91 98765 43210" required>
      </div>
      <div class="field" id="otpField" style="display:none">
        <label>OTP Code</label>
        <input type="text" maxlength="6" placeholder="6-digit code">
      </div>
      <button class="cta" type="submit">
        <span class="label" id="phoneBtnLabel">Send OTP</span>
        <span class="spinner"><div></div></span>
      </button>
    </form>

    <div class="footer-note">
      New to Nyxora? <a href="#">Create an account</a>
    </div>
  </div>
</div>

<script>
  // ambient starfield
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth; c.height = innerHeight; }
  resize(); addEventListener('resize', resize);
  const stars = Array.from({length:140}, () => ({
    x: Math.random()*innerWidth, y: Math.random()*innerHeight,
    r: Math.random()*1.4+0.2, s: Math.random()*0.6+0.1, o: Math.random()
  }));
  function loop(){
    ctx.clearRect(0,0,c.width,c.height);
    for(const st of stars){
      st.o += (Math.random()-0.5)*0.02;
      st.o = Math.max(0.15, Math.min(1, st.o));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(244,241,255,${st.o})`;
      ctx.fill();
      st.y += st.s*0.05;
      if(st.y > innerHeight) st.y = 0;
    }
    requestAnimationFrame(loop);
  }
  loop();

  // fake session check → skip login if "remembered"
  window.addEventListener('load', () => {
    const toast = document.getElementById('sessionToast');
    setTimeout(() => toast.classList.add('show'), 300);
    setTimeout(() => {
      const remembered = localStorageSafe();
      toast.innerHTML = remembered
        ? '<span class="dot"></span> Session restored — redirecting to Home…'
        : '<span class="dot" style="background:#9C93B8;box-shadow:none"></span> No active session found';
      setTimeout(() => toast.classList.remove('show'), 1800);
    }, 1200);
  });
  function localStorageSafe(){ return false; } // placeholder: real app checks refresh-token cookie via backend

  function switchTab(tab){
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
    document.getElementById('emailForm').style.display = tab === 'email' ? 'block' : 'none';
    document.getElementById('phoneForm').style.display = tab === 'phone' ? 'block' : 'none';
  }

  let otpSent = false;
  function handleSubmit(e, type){
    e.preventDefault();
    const btn = e.target.querySelector('.cta');
    if(type === 'phone' && !otpSent){
      otpSent = true;
      document.getElementById('otpField').style.display = 'block';
      document.getElementById('phoneBtnLabel').textContent = 'Verify OTP';
      return false;
    }
    btn.classList.add('loading');
    setTimeout(() => {
      // On success: backend returns { access_token, refresh_token }.
      // Store refresh_token in httpOnly cookie (set by server), access_token in memory, then redirect.
      window.location.href = '/home'; // -> Home Page, per Login Redirect Rule
    }, 900);
    return false;
  }

  function fakeLogin(provider){
    const toast = document.getElementById('sessionToast');
    toast.innerHTML = `<span class="dot"></span> Redirecting to ${provider}…`;
    toast.classList.add('show');
    setTimeout(() => { window.location.href = '/home'; }, 900);
  }
</script>
</body>
</html>
